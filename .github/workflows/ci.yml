name: CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: restore
      run: dotnet restore
    - name: build
      run: dotnet build --no-restore -c Release
    - name: test
      run: |
        dotnet run --project Arbor.Hypermedia.Tests/Arbor.Hypermedia.Tests.csproj --no-build -c Release
        dotnet run --project Arbor.Hypermedia.Generators.Tests/Arbor.Hypermedia.Generators.Tests.csproj --no-build -c Release
